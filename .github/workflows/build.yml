name: Build

on:
  push:
    branches: [desktop-app, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - run: node --test test/*.test.mjs
      - run: node --test desktop/test/*.test.mjs
      - run: npm run typecheck
        working-directory: desktop
      - name: Check the tag matches every version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for file in manifest.json manifest.firefox.json desktop/package.json; do
            version="$(node -p "require('./$file').version")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "$file says $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  desktop:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            app: dist/win-unpacked/Transcripables.exe
            engine: dist/win-unpacked/resources/engine
          - os: macos-latest
            script: dist:mac
            app: dist/mac-arm64/Transcripables.app/Contents/MacOS/Transcripables
            engine: dist/mac-arm64/Transcripables.app/Contents/Resources/engine
          - os: macos-15-intel
            script: dist:mac
            app: dist/mac/Transcripables.app/Contents/MacOS/Transcripables
            engine: dist/mac/Transcripables.app/Contents/Resources/engine
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - name: Build the installer
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$WIN_CSC_LINK" ]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          npm run "${{ matrix.script }}"
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: desktop/.model-cache
          key: engine-models-${{ runner.os }}-${{ hashFiles('desktop/main/models.js') }}
      - name: Transcribe real speech and tell voices apart with the built engine
        run: node scripts/test-engine.js "${{ matrix.engine }}"
        env:
          MODEL_CACHE: .model-cache
      - name: Open the built app
        run: node scripts/smoke.js "${{ matrix.app }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/dist/Transcripables-*.exe
            desktop/dist/Transcripables-*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: installers
          merge-multiple: true
      - run: bash scripts/pack.sh
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" installers/* dist/*.zip --prerelease --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
